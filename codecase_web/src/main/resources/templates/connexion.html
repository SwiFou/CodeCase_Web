<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:insert="fragments :: htmlHead">
  <title>Se connecter</title>
</head>
<!--! Changer les variables (Voir avec les controller)-->
<body>
<div th:insert="fragments :: headerContent"></div>
<main>
  <div id="main-container">
    <article>
      <div class ="article-header">
        <div class="info-container">
          <div class ="avatar-container">
            <div class ="pseudo">
              <span>Inscription</span>
            </div>
          </div>
        </div>
      </div>
      <div class="article-container">
        <form method="post" th:action="@{/loginUser}" th:object="${user}">
          <div class="form-group">
            <input type="text" th:field="*{emailUser}" placeholder="Email">
          </div>
          <div class="form-group">
            <input type="text" th:field="*{passwordUser}" placeholder="Mot de Passe">
          </div>
          <button type="submit">Submit</button>
        </form>
      </div>
      <div class="article-footer">
      </div>
    </article>
  </div>
</main>
<div th:insert="fragments :: footer"></div>

</body>
</html>
