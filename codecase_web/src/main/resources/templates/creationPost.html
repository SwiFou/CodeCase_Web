<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:insert="fragments :: htmlHead">
</head>
<!--! Changer les variables Langage et Outils & Technologies (Voir avec les controller)-->
<body>
<div th:insert="fragments :: headerContent"></div>
<main>
  <div id="main-container">
    <article>
      <h1>Créer un post</h1>
      <div class="article-container">
        <form method="post" th:action="@{/createPost}" th:object="${post}">
          <div class="form-group">
            <label>
              Titre du post
              <input type="text" th:field="*{postTitre}" placeholder="Titre du post"/>
            </label>
          </div>
          <div class="form-group">
            <label>
              Description du post
              <input type="text" th:field="*{postDescription}" placeholder="Description"/>
            </label>
          </div>
          <div class="form-group">
            <label>
              Langage dans lequel est écrit le code du post
              <select name="tagId">
                <option>Langage</option>
                <option th:each="tag: ${tags}"
                        th:value="${tag.idTag}" th:text="${tag.intituleTag}">
                </option>
              </select>
            </label>
          </div>
          <div class="form-group">
            <label>
              Les outils et technologies du code du post
              <select name="technoId">
                <option>Outils & Technologies</option>
                <option th:each="tag: ${tags}"
                        th:value="${tag.idTag}" th:text="${tag.intituleTag}">
                </option>
              </select>
            </label>
          </div>
          <div class="form-group">
            <label>
              <textarea th:field="*{postContenu}" placeholder="Code"></textarea>
            </label>
          </div>

          <button type="submit">Valider</button>

        </form>
      </div>
    </article>
  </div>
</main>
<div th:insert="fragments :: footer"></div>

</body>
</html>
